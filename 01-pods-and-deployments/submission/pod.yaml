apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  containers:
  - name: nginx-container
    image: nginx:1.27
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  labels:
    app: web
spec:
  volumes:
  - name: logs
    emptyDir: {}
  containers:
  - name: app
    image: nginx:1.27
    volumeMounts:
    - name: logs
      mountPath: /var/log/shared
  - name: logger
    image: busybox:1.36
    command: ["sh", "-c", "tail -f /dev/null"]
    volumeMounts:
    - name: log
      mountPath: /var/log/shared
