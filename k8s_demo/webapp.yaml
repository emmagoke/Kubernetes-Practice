apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-depolyment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metatdata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: nanajanashia/k8s-demo-app:v1.0
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  selectors:
    app: mongo
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
